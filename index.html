<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1f5f1">
    <meta name="default-database-url" content="https://schedule-ca02f-default-rtdb.firebaseio.com">
    <title>우리팀 달력</title>
    <style>
      :root {
        --canvas: #eef4ef;
        --paper: #fffefb;
        --ink: #25332e;
        --muted: #6f7d77;
        --line: #d8e2dc;
        --line-strong: #bdccc3;
        --home-bg: #c8e9df;
        --home-ink: #205d50;
        --vacation-bg: #ffc1b1;
        --vacation-ink: #873d31;
        --training-bg: #c9e2f3;
        --training-ink: #285c7d;
        --custom-bg: #f5df86;
        --custom-ink: #64531c;
        --focus: #1f6f9f;
        --accent: #f0d66d;
        --accent-ink: #4c431d;
        --sky: #c5dff0;
        --danger: #b74736;
        --shadow: 0 16px 44px rgba(47, 70, 59, 0.11);
        color: var(--ink);
        background: var(--canvas);
        font-family: "Gowun Dodum", "NanumSquareRound", "Malgun Gothic", sans-serif;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      [hidden] {
        display: none !important;
      }

      html {
        min-width: 320px;
        background: var(--canvas);
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(90deg, var(--home-bg) 0 25%, var(--accent) 25% 50%, var(--vacation-bg) 50% 75%, var(--sky) 75%) top / 100% 7px no-repeat,
          var(--canvas);
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      button:not(:disabled) {
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      #app {
        min-height: 100vh;
        padding-top: 7px;
      }

      .app-shell {
        width: min(100%, 760px);
        min-height: calc(100vh - 7px);
        margin-inline: auto;
        background: var(--paper);
      }

      .topbar {
        display: flex;
        min-height: 72px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 15px 16px 12px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        position: relative;
        display: grid;
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        place-items: center;
        border: 1px solid #dfbf49;
        border-radius: 8px;
        color: var(--accent-ink);
        background: var(--accent);
        font-size: 13px;
        font-weight: 700;
        box-shadow: inset 0 7px 0 rgba(255, 255, 255, 0.35);
      }

      .brand-mark::before,
      .brand-mark::after {
        position: absolute;
        top: -4px;
        width: 3px;
        height: 9px;
        border-radius: 2px;
        background: var(--ink);
        content: "";
      }

      .brand-mark::before { left: 10px; }
      .brand-mark::after { right: 10px; }

      .brand-copy {
        min-width: 0;
      }

      .brand-copy strong {
        display: block;
        overflow: hidden;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .brand-copy small {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
      }

      .toolbar {
        display: flex;
        flex: 0 0 auto;
        gap: 7px;
      }

      .icon-button,
      .month-button {
        display: inline-grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: #fff;
        font-size: 19px;
        line-height: 1;
      }

      .icon-button:hover,
      .month-button:hover {
        border-color: var(--ink);
        background: #f7faf7;
      }

      .create-page {
        display: grid;
        min-height: calc(100vh - 7px);
        align-content: start;
      }

      .create-intro {
        padding: 36px 20px 24px;
        border-bottom: 1px solid var(--line);
        background: #f9fcf9;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--home-ink);
        font-size: 12px;
        font-weight: 700;
      }

      .create-intro h1 {
        max-width: 430px;
        margin: 0;
        font-size: clamp(27px, 8vw, 39px);
        font-weight: 700;
        line-height: 1.24;
      }

      .create-intro p {
        max-width: 500px;
        margin: 13px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .create-form {
        padding: 26px 20px 40px;
      }

      .form-section + .form-section {
        margin-top: 28px;
        padding-top: 25px;
        border-top: 1px solid var(--line);
      }

      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .section-heading h2 {
        margin: 0;
        font-size: 16px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field + .field {
        margin-top: 12px;
      }

      .field label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .field input {
        width: 100%;
        height: 46px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        padding: 0 12px;
        color: var(--ink);
        background: #fff;
      }

      .field input::placeholder {
        color: #a5b0aa;
      }

      .field input[aria-invalid="true"] {
        border-color: var(--danger);
      }

      .field-hint,
      .field-error,
      .form-message {
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
      }

      .field-hint { color: var(--muted); }
      .field-error,
      .form-message.error { color: var(--danger); }

      .member-row {
        display: grid;
        grid-template-columns: 1fr 38px;
        gap: 7px;
        align-items: end;
        margin-top: 11px;
      }

      .member-row.required {
        grid-template-columns: 1fr;
      }

      .remove-button {
        width: 38px;
        height: 46px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        color: var(--danger);
        background: #fff;
        font-size: 19px;
      }

      .small-button,
      .text-button {
        min-height: 34px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        padding: 6px 10px;
        background: #fff;
        font-size: 12px;
      }

      .connection-switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f3f6f3;
      }

      .connection-switch button {
        min-height: 40px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        font-size: 13px;
      }

      .connection-switch button.active {
        border-color: var(--line-strong);
        background: #fff;
        box-shadow: 0 2px 6px rgba(37, 51, 46, 0.07);
        font-weight: 700;
      }

      .database-field {
        margin-top: 13px;
      }

      .privacy-note {
        margin: 13px 0 0;
        padding-left: 12px;
        border-left: 3px solid var(--accent);
        color: var(--muted);
        font-size: 11px;
        line-height: 1.6;
      }

      .primary-button {
        width: 100%;
        min-height: 49px;
        margin-top: 26px;
        border: 1px solid #dfbf49;
        border-radius: 8px;
        color: var(--accent-ink);
        background: var(--accent);
        font-weight: 700;
      }

      .primary-button:hover { background: #f6df82; }

      .calendar-page {
        min-height: calc(100vh - 7px);
      }

      .connection-state {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .connection-state::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #9ca8a1;
        content: "";
      }

      .connection-state.online::before { background: #3ca276; }
      .connection-state.offline::before { background: var(--vacation-ink); }
      .connection-state.local::before { background: #598fb2; }

      .month-nav {
        display: grid;
        grid-template-columns: 38px 1fr 38px;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
      }

      .month-title {
        margin: 0;
        text-align: center;
        font-size: 20px;
      }

      .member-picker {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        padding: 0 16px 13px;
        scrollbar-width: none;
      }

      .member-picker::-webkit-scrollbar { display: none; }

      .member-button {
        min-width: max-content;
        min-height: 36px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        padding: 6px 10px;
        background: #fff;
        font-size: 12px;
      }

      .member-button[aria-pressed="true"] {
        border-color: #78a9c8;
        color: #235b7d;
        background: #e6f2fa;
        font-weight: 700;
      }

      .member-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 5px;
        border-radius: 50%;
        background: #79aeca;
      }

      .calendar-wrap {
        border-top: 1px solid var(--line);
        border-left: 1px solid var(--line);
      }

      .weekdays,
      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
      }

      .weekday {
        display: grid;
        min-width: 0;
        height: 29px;
        place-items: center;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        background: #f7f9f7;
        font-size: 10px;
      }

      .weekday:first-child { color: var(--vacation-ink); }

      .day-cell {
        position: relative;
        display: block;
        min-width: 0;
        height: 70px;
        overflow: hidden;
        border: 0;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        padding: 5px 4px;
        text-align: left;
        background: rgba(255, 255, 255, 0.86);
      }

      .day-cell.empty {
        background: #f4f6f3;
      }

      .day-cell:not(.empty):hover {
        background: #f8fbf8;
      }

      .day-cell.selected {
        background: #fff9d9;
        box-shadow: inset 0 0 0 2px var(--accent);
      }

      .day-cell.today .day-number {
        display: inline-grid;
        width: 20px;
        height: 20px;
        place-items: center;
        border-radius: 50%;
        color: #fff;
        background: var(--ink);
      }

      .day-cell.sunday .day-number { color: var(--vacation-ink); }
      .day-cell.today.sunday .day-number { color: #fff; }

      .day-cell.public-holiday .day-number { color: var(--vacation-ink); }
      .day-cell.today.public-holiday .day-number { color: #fff; }

      .day-heading {
        display: flex;
        min-width: 0;
        height: 21px;
        align-items: center;
        gap: 3px;
      }

      .day-number {
        display: inline-block;
        flex: 0 0 auto;
        height: 21px;
        font-size: 10px;
        line-height: 20px;
      }

      .holiday-label {
        min-width: 0;
        overflow: hidden;
        border-radius: 3px;
        padding: 1px 3px;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 7px;
        line-height: 13px;
      }

      .holiday-label.public {
        color: var(--vacation-ink);
        background: #ffe5de;
      }

      .schedule-badge {
        display: block;
        width: 100%;
        margin-top: 2px;
        overflow: hidden;
        border-radius: 4px;
        padding: 2px 3px;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 8px;
        line-height: 1.3;
      }

      .schedule-badge.continues-before {
        width: calc(100% + 4px);
        margin-left: -4px;
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
        padding-left: 7px;
      }

      .schedule-badge.continues-after {
        width: calc(100% + 4px);
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
        padding-right: 7px;
      }

      .schedule-badge.continues-before.continues-after {
        width: calc(100% + 8px);
      }

      .schedule-badge.home,
      .status-button.home,
      .day-summary-item.home {
        color: var(--home-ink);
        background: var(--home-bg);
      }

      .schedule-badge.vacation,
      .status-button.vacation,
      .day-summary-item.vacation {
        color: var(--vacation-ink);
        background: var(--vacation-bg);
      }

      .schedule-badge.training,
      .status-button.training,
      .day-summary-item.training {
        color: var(--training-ink);
        background: var(--training-bg);
      }

      .schedule-badge.custom,
      .status-button.custom,
      .day-summary-item.custom {
        color: var(--custom-ink);
        background: var(--custom-bg);
      }

      .more-count {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 8px;
        text-align: right;
      }

      .status-editor {
        position: sticky;
        bottom: 0;
        z-index: 2;
        padding: 15px 16px 18px;
        border-top: 1px solid var(--line);
        background: rgba(255, 254, 251, 0.97);
        box-shadow: 0 -8px 22px rgba(47, 70, 59, 0.07);
      }

      .selected-day-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      .selected-day-head h2 {
        margin: 0;
        font-size: 15px;
      }

      .schedule-range-controls {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        margin-top: 9px;
      }

      .range-mode-switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #f3f6f3;
      }

      .range-mode-switch button {
        min-width: 54px;
        height: 32px;
        border: 1px solid transparent;
        border-radius: 5px;
        padding: 0 8px;
        background: transparent;
        font-size: 11px;
      }

      .range-mode-switch button[aria-pressed="true"] {
        border-color: var(--line-strong);
        background: #fff;
        font-weight: 700;
      }

      .range-end-field {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 7px;
      }

      .range-end-field label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .range-end-field input {
        min-width: 0;
        width: 100%;
        height: 38px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        padding: 0 8px;
        color: var(--ink);
        background: #fff;
        font-size: 12px;
      }

      .range-message {
        min-height: 17px;
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 11px;
      }

      .range-message.error { color: var(--danger); }

      .range-apply-button {
        min-height: 42px;
        margin-top: 8px;
      }

      .editor-person {
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .day-summary {
        display: flex;
        min-height: 26px;
        align-items: center;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 8px;
      }

      .day-summary:empty::before {
        color: var(--muted);
        content: "등록된 일정 없음";
        font-size: 11px;
      }

      .day-summary-person {
        display: inline-flex;
        min-width: 0;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
      }

      .day-summary-name {
        padding: 1px 4px;
        font-size: 10px;
        font-weight: 700;
      }

      .day-summary-item {
        min-width: 0;
        border-radius: 5px;
        padding: 4px 7px;
        font-size: 10px;
      }

      .holiday-details {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: start;
        gap: 8px;
        margin-top: 9px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
      }

      .holiday-detail-list {
        display: flex;
        min-width: 0;
        flex-wrap: wrap;
        gap: 5px;
      }

      .holiday-detail {
        border-radius: 5px;
        padding: 4px 7px;
        font-size: 10px;
      }

      .holiday-detail.public {
        color: var(--vacation-ink);
        background: #ffe5de;
      }

      .holiday-detail.empty {
        color: var(--muted);
        background: #f5f7f4;
      }

      .holiday-edit-button {
        min-height: 30px;
        white-space: nowrap;
      }

      .status-buttons {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(68px, 1fr));
        gap: 7px;
        margin-top: 10px;
      }

      .status-button {
        min-width: 0;
        height: 40px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: #f5f7f4;
        font-size: 12px;
      }

      .status-button[aria-pressed="true"] {
        border-color: currentColor;
        box-shadow: inset 0 0 0 1px currentColor;
        font-weight: 700;
      }

      .custom-editor {
        margin-top: 10px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        padding: 11px;
        background: #fffdf3;
      }

      .custom-editor label {
        display: block;
        margin-bottom: 6px;
        color: var(--custom-ink);
        font-size: 11px;
        font-weight: 700;
      }

      .custom-editor input {
        width: 100%;
        height: 40px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        padding: 0 10px;
        color: var(--ink);
        background: #fff;
      }

      .custom-editor input[aria-invalid="true"] {
        border-color: var(--danger);
      }

      .custom-error {
        min-height: 18px;
        margin: 4px 0 0;
        color: var(--danger);
        font-size: 11px;
      }

      .custom-actions {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        margin-top: 7px;
      }

      .holiday-editor {
        margin-top: 8px;
        border: 1px solid #dfbf49;
        border-radius: 8px;
        padding: 11px;
        background: #fffdf3;
      }

      .holiday-editor label {
        display: block;
        margin-bottom: 6px;
        color: var(--custom-ink);
        font-size: 11px;
        font-weight: 700;
      }

      .holiday-editor input {
        width: 100%;
        height: 40px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        padding: 0 10px;
        color: var(--ink);
        background: #fff;
      }

      .holiday-editor input[aria-invalid="true"] { border-color: var(--danger); }

      .toast {
        position: fixed;
        z-index: 20;
        left: 50%;
        bottom: 20px;
        width: max-content;
        max-width: calc(100vw - 32px);
        transform: translateX(-50%);
        border: 1px solid #18231f;
        border-radius: 7px;
        padding: 10px 13px;
        color: #fff;
        background: #25332e;
        box-shadow: var(--shadow);
        font-size: 12px;
      }

      .state-page {
        display: grid;
        min-height: calc(100vh - 7px);
        place-items: center;
        padding: 30px 20px;
        text-align: center;
      }

      .state-content {
        max-width: 380px;
      }

      .state-mark {
        display: grid;
        width: 52px;
        height: 52px;
        margin: 0 auto 16px;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        font-size: 22px;
      }

      .state-content h1 {
        margin: 0;
        font-size: 22px;
      }

      .state-content p {
        margin: 10px 0 20px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.65;
      }

      .state-actions {
        display: flex;
        justify-content: center;
        gap: 8px;
      }

      dialog {
        width: min(calc(100% - 32px), 430px);
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        padding: 0;
        color: var(--ink);
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      dialog::backdrop { background: rgba(24, 35, 31, 0.32); }

      .dialog-content { padding: 20px; }
      .dialog-content h2 { margin: 0; font-size: 18px; }
      .dialog-content p { color: var(--muted); font-size: 12px; line-height: 1.6; }
      .dialog-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 16px; }

      .manual-link {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        padding: 8px;
        font-size: 11px;
      }

      @media (min-width: 620px) {

      const pad = (value) => String(value).padStart(2, '0')

      export function validateRoomDraft(draft) {
        const title = String(draft.title ?? '').trim()
        const names = Array.from(draft.names ?? [], (name) => String(name).trim())
        const fieldErrors = {}

        if (!title || title.length > 30) {
          fieldErrors.title = '팀 이름은 1~30자로 입력해 주세요.'
        }
        if (names.length < 2 || names.length > 6) {
          fieldErrors.form = '이름은 2~6명까지 입력할 수 있어요.'
        }

        names.forEach((name, index) => {
          if (!name || name.length > 12) {
            ;(fieldErrors.names ??= {})[index] = '이름은 1~12자로 입력해 주세요.'
            return
          }
          const normalized = name.toLocaleLowerCase('ko-KR')
          const firstIndex = names.findIndex(
            (candidate) => candidate.toLocaleLowerCase('ko-KR') === normalized,
          )
          if (firstIndex !== index) {
            ;(fieldErrors.names ??= {})[index] = '이름이 중복됐어요.'
          }
        })

        return Object.keys(fieldErrors).length > 0
          ? { ok: false, fieldErrors }
          : { ok: true, value: { title, names } }
      }

      export function monthKey(year, monthIndex) {
        return `${year}-${pad(monthIndex + 1)}`
      }

      export function dateKey(year, monthIndex, day) {
        return `${monthKey(year, monthIndex)}-${pad(day)}`
      }

      export function buildMonthGrid(year, monthIndex, today = new Date()) {
        const firstWeekday = new Date(year, monthIndex, 1).getDay()
        const daysInMonth = new Date(year, monthIndex + 1, 0).getDate()

        return Array.from({ length: 42 }, (_, index) => {
          const day = index - firstWeekday + 1
          if (day < 1 || day > daysInMonth) return null
          return {
            day,
            key: dateKey(year, monthIndex, day),
            isSunday: index % 7 === 0,
            isToday:
              today.getFullYear() === year &&
              today.getMonth() === monthIndex &&
              today.getDate() === day,
          }
        })
      }

      export function normalizeMemberSchedule(value) {
        if (value === 'home' || value === 'vacation') return { [value]: true }
        if (!value || typeof value !== 'object' || Array.isArray(value)) return {}

        const normalized = {}
        FIXED_STATUSES.forEach((status) => {
          if (value[status] === true) normalized[status] = true
        })
        if (typeof value.custom === 'string') {
          const custom = value.custom.trim()
          if (custom.length >= 1 && custom.length <= 12) normalized.custom = custom
        }
        return normalized
      }

      export function toggleFixedStatus(value, status) {
        if (!FIXED_STATUSES.includes(status)) throw new RangeError(`Unsupported fixed status: ${status}`)
        const nextValue = normalizeMemberSchedule(value)
        if (nextValue[status]) delete nextValue[status]
        else nextValue[status] = true
        return nextValue
      }

      export function setCustomSchedule(value, text) {
        const custom = String(text ?? '').trim()
        if (custom.length < 1 || custom.length > 12) {
          throw new RangeError('기타 일정은 1~12자로 입력해 주세요.')
        }
        return { ...normalizeMemberSchedule(value), custom }
      }

      export function clearCustomSchedule(value) {
        const nextValue = normalizeMemberSchedule(value)
        delete nextValue.custom
        return nextValue
      }

      export function isEmptyMemberSchedule(value) {
        return Object.keys(normalizeMemberSchedule(value)).length === 0
      }

      export function memberScheduleLabel(value) {
        const schedule = normalizeMemberSchedule(value)
        const labels = FIXED_STATUSES.filter((status) => schedule[status]).map((status) => STATUS_LABELS[status])
        if (schedule.custom) labels.push(schedule.custom)
        return labels.join('·')
      }

      export function serializeMemberSchedule(value) {
        const schedule = normalizeMemberSchedule(value)
        return Object.keys(schedule).length > 0 ? schedule : null
      }

      export function buildDateRange(startDate, endDate) {
        const parseDate = (value) => {
          const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value))
          if (!match) throw new RangeError('날짜 범위를 확인해 주세요.')
          const timestamp = Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3]))
          const normalized = new Date(timestamp).toISOString().slice(0, 10)
          if (normalized !== value) throw new RangeError('날짜 범위를 확인해 주세요.')
          return timestamp
        }
        const startTimestamp = parseDate(startDate)
        const endTimestamp = parseDate(endDate)
        const dayCount = Math.floor((endTimestamp - startTimestamp) / 86_400_000) + 1
        if (dayCount < 1) throw new RangeError('종료일은 시작일 이후로 선택해 주세요.')
        if (dayCount > 31) throw new RangeError('연속 일정은 최대 31일까지 등록할 수 있어요.')
        return Array.from({ length: dayCount }, (_, index) => (
          new Date(startTimestamp + index * 86_400_000).toISOString().slice(0, 10)
        ))
      }

      function offsetDateKey(value, dayOffset) {
        const [year, month, day] = value.split('-').map(Number)
        return new Date(Date.UTC(year, month - 1, day + dayOffset)).toISOString().slice(0, 10)
      }

      export function buildScheduleRangePatch(dates, memberId, value) {
        const schedule = serializeMemberSchedule(value)
        return Object.fromEntries(
          dates.map((date) => [`${date.slice(0, 7)}/${date}/${memberId}`, schedule]),
        )
      }

      export function memberSchedulesMatch(leftValue, rightValue) {
        const left = serializeMemberSchedule(leftValue)
        const right = serializeMemberSchedule(rightValue)
        return left !== null && right !== null && JSON.stringify(left) === JSON.stringify(right)
      }

      export function getPublicHoliday(date) {
        return KOREAN_PUBLIC_HOLIDAYS[date] ?? null
      }

      export function getPublicHolidaysForMonth(year, monthIndex) {
        const prefix = `${monthKey(year, monthIndex)}-`
        return Object.fromEntries(
          Object.entries(KOREAN_PUBLIC_HOLIDAYS).filter(([date]) => date.startsWith(prefix)),
        )
      }

      export function isSupportedHolidayYear(year) {
        return Number.isInteger(year) && year >= 2025 && year <= 2030
      }

      export function combineHolidayLabels(publicHoliday, teamHoliday) {
        return [publicHoliday, teamHoliday].filter(Boolean).join('·')
      }

      export function normalizeTeamHolidayName(value) {
        if (typeof value !== 'string') return null
        const name = value.trim()
        return name.length >= 1 && name.length <= 20 ? name : null
      }

      export function serializeTeamHoliday(value) {
        return normalizeTeamHolidayName(value)
      }

      export function applyLocalHolidayChange(room, month, date, value) {
        const nextRoom = cloneJson(room)
        if (value === null) {
          if (!nextRoom.holidays?.[month]) return nextRoom
          delete nextRoom.holidays[month][date]
          if (Object.keys(nextRoom.holidays[month]).length === 0) delete nextRoom.holidays[month]
          if (Object.keys(nextRoom.holidays).length === 0) delete nextRoom.holidays
          return nextRoom
        }

        const holidayName = normalizeTeamHolidayName(value)
        if (!holidayName) throw new RangeError('회사 휴일명은 1~20자로 입력해 주세요.')
        nextRoom.holidays ??= {}
        nextRoom.holidays[month] ??= {}
        nextRoom.holidays[month][date] = holidayName
        return nextRoom
      }

      export function holidayPath(roomId, month, date) {
        const path = ['rooms', roomId, 'holidays', month]
        if (date) path.push(date)
        return path
      }

      export function rollbackTeamHolidayWrite(
        currentHolidays,
        date,
        previousHoliday,
        revisionAtStart,
        currentRevision,
      ) {
        const nextHolidays = cloneJson(currentHolidays) ?? {}
        if (revisionAtStart !== currentRevision) return nextHolidays
        if (previousHoliday === null) delete nextHolidays[date]
        else nextHolidays[date] = previousHoliday
        return nextHolidays
      }

      export function summarizeDay(daySchedules = {}, members = {}) {
        const allBadges = Object.entries(daySchedules)
          .filter(([memberId]) => members[memberId])
          .map(([memberId, value]) => [memberId, normalizeMemberSchedule(value)])
          .filter(([, schedule]) => Object.keys(schedule).length > 0)
          .sort(([leftId], [rightId]) => members[leftId].order - members[rightId].order)
          .map(([memberId, schedule]) => ({
            memberId,
            name: members[memberId].name,
            schedule,
            label: memberScheduleLabel(schedule),
          }))

        return {
          badges: allBadges.slice(0, 2),
          hiddenCount: Math.max(0, allBadges.length - 2),
        }
      }

      export function normalizeDatabaseUrl(rawValue) {
        try {
          const url = new URL(String(rawValue).trim())
          const isFirebaseHost =
            url.hostname.endsWith('.firebaseio.com') ||
            url.hostname.endsWith('.firebasedatabase.app')
          if (url.protocol !== 'https:' || !isFirebaseHost || (url.pathname !== '/' && url.pathname !== '')) {
            return null
          }
          return url.origin
        } catch {
          return null
        }
      }

      export function resolveDatabaseUrl({ queryValue, metaValue, rememberedValue }) {
        return normalizeDatabaseUrl(queryValue)
          ?? normalizeDatabaseUrl(metaValue)
          ?? normalizeDatabaseUrl(rememberedValue)
      }

      export function hasInvalidExplicitDatabaseUrl(queryValue) {
        return Boolean(queryValue) && normalizeDatabaseUrl(queryValue) === null
      }

      function cloneJson(value) {
        return value == null ? value : JSON.parse(JSON.stringify(value))
      }

      function mergePatch(target, patch) {
        const nextTarget = target && typeof target === 'object' ? target : {}
        Object.entries(patch ?? {}).forEach(([key, value]) => {
          if (value === null) delete nextTarget[key]
          else nextTarget[key] = cloneJson(value)
        })
        return nextTarget
      }

      export function applyRealtimeEvent(currentValue, event) {
        if (!event || typeof event.path !== 'string') return cloneJson(currentValue) ?? {}
        if (event.path === '/') {
          return event.type === 'patch'
            ? mergePatch(cloneJson(currentValue) ?? {}, event.data)
            : cloneJson(event.data) ?? {}
        }

        const nextValue = cloneJson(currentValue) ?? {}
        const parts = event.path.split('/').filter(Boolean)
        let target = nextValue

        for (let index = 0; index < parts.length - 1; index += 1) {
          const part = parts[index]
          if (!target[part] || typeof target[part] !== 'object') target[part] = {}
          target = target[part]
        }

        const finalPart = parts.at(-1)
        if (event.data === null) delete target[finalPart]
        else if (event.type === 'patch') target[finalPart] = mergePatch(target[finalPart], event.data)
        else target[finalPart] = cloneJson(event.data)
        return nextValue
      }

      export function parseRoomId(hash) {
        const roomId = new URLSearchParams(String(hash).replace(/^#/, '')).get('room')
        return roomId && ROOM_ID_PATTERN.test(roomId) ? roomId : null
      }

      export function buildShareUrl(currentUrl, roomId, databaseUrl) {
        const url = new URL(currentUrl)
        url.search = ''
        if (databaseUrl) url.searchParams.set('db', databaseUrl)
        url.hash = `room=${roomId}`
        return url.toString()
      }

      export function buildRoom(title, names, createdAt = Date.now()) {
        return {
          meta: { title, createdAt, schemaVersion: 1 },
          members: Object.fromEntries(
            names.map((name, index) => [`m${index + 1}`, { name, order: index + 1 }]),
          ),
        }
      }

      export function moveMonth(year, monthIndex, offset) {
        const date = new Date(year, monthIndex + offset, 1)
        return { year: date.getFullYear(), monthIndex: date.getMonth() }
      }

      export function createSubscriptionGuard() {
        let currentGeneration = 0
        return {
          begin() { return ++currentGeneration },
          isCurrent(generation) { return generation === currentGeneration },
        }
      }

      export function createUnsupportedYearNoticeTracker() {
        const notifiedYears = new Set()
        return {
          shouldNotify(year) {
            if (isSupportedHolidayYear(year) || notifiedYears.has(year)) return false
            notifiedYears.add(year)
            return true
          },
        }
      }

      export function firebaseEndpoint(databaseUrl, pathParts = []) {
        const base = String(databaseUrl).replace(/\/$/, '')
        const encodedPath = pathParts.map((part) => encodeURIComponent(String(part))).join('/')
        return `${base}/${encodedPath}.json`
      }

      export function parseEventStreamBlock(block) {
        const lines = String(block).split(/\r?\n/)
        const eventLine = lines.find((line) => line.startsWith('event:'))
        const dataLines = lines
          .filter((line) => line.startsWith('data:'))
          .map((line) => line.slice(5).trimStart())
        if (!eventLine || dataLines.length === 0) return null
        try {
          return {
            type: eventLine.slice(6).trim(),
            payload: JSON.parse(dataLines.join('\n')),
          }
        } catch {
          return null
        }
      }

      function createElement(tagName, className, text) {
        const element = document.createElement(tagName)
        if (className) element.className = className
        if (text !== undefined) element.textContent = text
        return element
      }

      function announce(message) {
        const announcer = document.querySelector('#announcer')
        if (!announcer) return
        announcer.textContent = ''
        requestAnimationFrame(() => { announcer.textContent = message })
      }

      let toastTimer
      function showToast(message) {
        document.querySelector('.toast')?.remove()
        const toast = createElement('div', 'toast', message)
        toast.setAttribute('role', 'status')
        document.body.append(toast)
        clearTimeout(toastTimer)
        toastTimer = setTimeout(() => toast.remove(), 3200)
        announce(message)
      }

      function createRoomId() {
        if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID()
        const bytes = new Uint8Array(16)
        globalThis.crypto.getRandomValues(bytes)
        bytes[6] = (bytes[6] & 0x0f) | 0x40
        bytes[8] = (bytes[8] & 0x3f) | 0x80
        const hex = Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('')
        return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`
      }

      function localRoomKey(roomId) {
        return `tiny-schedule:room:${roomId}`
      }

      function createLocalRepository() {
        const readRoom = (roomId) => {
          try {
            return JSON.parse(localStorage.getItem(localRoomKey(roomId)))
          } catch {
            return null
          }
        }

        const writeRoom = (roomId, room) => {
          localStorage.setItem(localRoomKey(roomId), JSON.stringify(room))
        }

        return {
          mode: 'local',
          databaseUrl: null,
          async createRoom(roomId, room) {
            writeRoom(roomId, { ...room, schedules: {} })
          },
          async getRoom(roomId) {
            const room = readRoom(roomId)
            return room?.meta && room?.members ? { meta: room.meta, members: room.members } : null
          },
          subscribeMonth(roomId, month, handlers) {
            let channel
            const emit = () => handlers.onValue(readRoom(roomId)?.schedules?.[month] ?? {})
            const storageHandler = (event) => {
              if (event.key === localRoomKey(roomId)) emit()
            }
            window.addEventListener('storage', storageHandler)
            if ('BroadcastChannel' in window) {
              channel = new BroadcastChannel(`tiny-schedule:${roomId}`)
              channel.addEventListener('message', emit)
            }
            handlers.onConnection('local')
            emit()
            return () => {
              window.removeEventListener('storage', storageHandler)
              channel?.close()
            }
          },
          subscribeHolidays(roomId, month, handlers) {
            let channel
            const emit = () => handlers.onValue(readRoom(roomId)?.holidays?.[month] ?? {})
            const storageHandler = (event) => {
              if (event.key === localRoomKey(roomId)) emit()
            }
            window.addEventListener('storage', storageHandler)
            if ('BroadcastChannel' in window) {
              channel = new BroadcastChannel(`tiny-schedule:${roomId}`)
              channel.addEventListener('message', emit)
            }
            handlers.onConnection('local')
            emit()
            return () => {
              window.removeEventListener('storage', storageHandler)
              channel?.close()
            }
          },
          async setSchedule(roomId, month, date, memberId, value) {
            const room = readRoom(roomId)
            if (!room) throw new Error('Room not found')
            room.schedules ??= {}
            room.schedules[month] ??= {}
            room.schedules[month][date] ??= {}
            const schedule = serializeMemberSchedule(value)
            if (schedule === null) delete room.schedules[month][date][memberId]
            else room.schedules[month][date][memberId] = schedule
            if (Object.keys(room.schedules[month][date]).length === 0) delete room.schedules[month][date]
            writeRoom(roomId, room)
            if ('BroadcastChannel' in window) {
              const channel = new BroadcastChannel(`tiny-schedule:${roomId}`)
              channel.postMessage({ type: 'changed' })
              channel.close()
            }
          },
          async setScheduleRange(roomId, dates, memberId, value) {
            const room = readRoom(roomId)
            if (!room) throw new Error('Room not found')
            const schedule = serializeMemberSchedule(value)
            room.schedules ??= {}
            dates.forEach((date) => {
              const month = date.slice(0, 7)
              room.schedules[month] ??= {}
              room.schedules[month][date] ??= {}
              if (schedule === null) delete room.schedules[month][date][memberId]
              else room.schedules[month][date][memberId] = schedule
              if (Object.keys(room.schedules[month][date]).length === 0) {
                delete room.schedules[month][date]
              }
              if (Object.keys(room.schedules[month]).length === 0) delete room.schedules[month]
            })
            writeRoom(roomId, room)
            if ('BroadcastChannel' in window) {
              const channel = new BroadcastChannel(`tiny-schedule:${roomId}`)
              channel.postMessage({ type: 'changed' })
              channel.close()
            }
          },
          async setHoliday(roomId, month, date, value) {
            const room = readRoom(roomId)
            if (!room) throw new Error('Room not found')
            writeRoom(roomId, applyLocalHolidayChange(room, month, date, value))
            if ('BroadcastChannel' in window) {
              const channel = new BroadcastChannel(`tiny-schedule:${roomId}`)
              channel.postMessage({ type: 'changed' })
              channel.close()
            }
          },
        }
      }

      function createFirebaseRepository(databaseUrl) {
        const request = async (pathParts, options = {}) => {
          const response = await fetch(firebaseEndpoint(databaseUrl, pathParts), {
            ...options,
            headers: { 'Content-Type': 'application/json', ...options.headers },
          })
          if (!response.ok) throw new Error(`Firebase request failed: ${response.status}`)
          return response.status === 204 ? null : response.json()
        }

        return {
          mode: 'online',
          databaseUrl,
          async createRoom(roomId, room) {
            await request(['rooms', roomId], { method: 'PUT', body: JSON.stringify(room) })
          },
          async getRoom(roomId) {
            const room = await request(['rooms', roomId])
            return room?.meta && room?.members ? { meta: room.meta, members: room.members } : null
          },
          subscribeMonth(roomId, month, handlers) {
            let currentValue = {}
            const stream = new EventSource(firebaseEndpoint(databaseUrl, ['rooms', roomId, 'schedules', month]))
            stream.onopen = () => handlers.onConnection('online')
            stream.onerror = () => handlers.onConnection('offline')

            const receive = (type) => (event) => {
              try {
                const payload = JSON.parse(event.data)
                currentValue = applyRealtimeEvent(currentValue, { ...payload, type })
                handlers.onValue(currentValue)
              } catch (error) {
                handlers.onError(error instanceof Error ? error : new Error(String(error)))
              }
            }
            stream.addEventListener('put', receive('put'))
            stream.addEventListener('patch', receive('patch'))
            stream.addEventListener('cancel', () => handlers.onError(new Error('Firebase access denied')))
            stream.addEventListener('auth_revoked', () => handlers.onError(new Error('Firebase access revoked')))
            return () => stream.close()
          },
          subscribeHolidays(roomId, month, handlers) {
            let currentValue = {}
            const stream = new EventSource(firebaseEndpoint(databaseUrl, holidayPath(roomId, month)))
            stream.onopen = () => handlers.onConnection('online')
            stream.onerror = () => handlers.onConnection('offline')

            const receive = (type) => (event) => {
              try {
                const payload = JSON.parse(event.data)
                currentValue = applyRealtimeEvent(currentValue, { ...payload, type })
                handlers.onValue(currentValue)
              } catch (error) {
                handlers.onError(error instanceof Error ? error : new Error(String(error)))
              }
            }
            stream.addEventListener('put', receive('put'))
            stream.addEventListener('patch', receive('patch'))
            stream.addEventListener('cancel', () => handlers.onError(new Error('Firebase access denied')))
            stream.addEventListener('auth_revoked', () => handlers.onError(new Error('Firebase access revoked')))
            return () => stream.close()
          },
          async setSchedule(roomId, month, date, memberId, value) {
            const path = ['rooms', roomId, 'schedules', month, date, memberId]
            const schedule = serializeMemberSchedule(value)
            if (schedule === null) await request(path, { method: 'DELETE' })
            else await request(path, { method: 'PUT', body: JSON.stringify(schedule) })
          },
          async setScheduleRange(roomId, dates, memberId, value) {
            await request(['rooms', roomId, 'schedules'], {
              method: 'PATCH',
              body: JSON.stringify(buildScheduleRangePatch(dates, memberId, value)),
            })
          },
          async setHoliday(roomId, month, date, value) {
            const path = holidayPath(roomId, month, date)
            if (value === null) {
              await request(path, { method: 'DELETE' })
              return
            }
            const holidayName = normalizeTeamHolidayName(value)
            if (!holidayName) throw new RangeError('회사 휴일명은 1~20자로 입력해 주세요.')
            await request(path, { method: 'PUT', body: JSON.stringify(holidayName) })
          },
        }
      }

      export async function completeRoomCreation({
        repository,
        roomId,
        room,
        currentUrl,
        replaceUrl,
        openCalendar,
      }) {
        await repository.createRoom(roomId, room)
        const url = buildShareUrl(currentUrl, roomId, repository.databaseUrl)
        replaceUrl(url)
        openCalendar({ roomId, room, repository })
        return url
      }

      export function returnToCreation({ currentUrl, replaceUrl, openCreate }) {
        const url = new URL(currentUrl)
        url.hash = ''
        const nextUrl = url.toString()
        replaceUrl(nextUrl)
        openCreate()
        return nextUrl
      }

      async function shareUrl(title, url) {
        if (navigator.share) {
          try {
            await navigator.share({ title, text: `${title} 재택·휴가·교육 일정판`, url })
            return 'shared'
          } catch (error) {
            if (error?.name === 'AbortError') return 'cancelled'
          }
        }
        try {
          await navigator.clipboard.writeText(url)
          return 'copied'
        } catch {
          return 'manual'
        }
      }
