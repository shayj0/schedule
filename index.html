                <button class="status-button custom" type="button" data-status="custom" aria-expanded="false" aria-controls="custom-editor">＋ 기타</button>
              </div>
              <div class="custom-editor" id="custom-editor" hidden>
                <label for="custom-schedule-input">기타 일정</label>
                <input id="custom-schedule-input" maxlength="12" autocomplete="off" placeholder="예: 출장, 외근" aria-describedby="custom-schedule-error">
                <p class="custom-error" id="custom-schedule-error"></p>
                <div class="custom-actions">
                  <button class="text-button" type="button" data-custom-action="close">닫기</button>
                  <button class="text-button" type="button" data-custom-action="delete">삭제</button>
                  <button class="text-button" type="button" data-custom-action="save">저장</button>
                </div>
              </div>
              <button class="primary-button range-apply-button" type="button" data-range-action="apply" hidden>기간에 적용</button>
            </section>
          </section>`

        root.querySelector('#team-name').textContent = room.meta.title
        const connectionState = root.querySelector('.connection-state')
        const monthTitle = root.querySelector('.month-title')
        const memberPicker = root.querySelector('.member-picker')
        const calendarGrid = root.querySelector('.calendar-grid')
        const selectedDateElement = root.querySelector('.selected-date')
        const editorPerson = root.querySelector('.editor-person')
        const rangeModeButtons = Array.from(root.querySelectorAll('[data-range-mode]'))
        const rangeEndField = root.querySelector('.range-end-field')
        const rangeEndInput = root.querySelector('#range-end-date')
        const rangeMessage = root.querySelector('#range-message')
        const rangeApplyButton = root.querySelector('[data-range-action="apply"]')
        const holidayDetailList = root.querySelector('.holiday-detail-list')
        const holidayEditButton = root.querySelector('.holiday-edit-button')
        const holidayEditor = root.querySelector('#holiday-editor')
        const teamHolidayInput = root.querySelector('#team-holiday-input')
        const teamHolidayErrorElement = root.querySelector('#team-holiday-error')
        const holidaySaveButton = root.querySelector('[data-holiday-action="save"]')
        const holidayDeleteButton = root.querySelector('[data-holiday-action="delete"]')
        const holidayCloseButton = root.querySelector('[data-holiday-action="close"]')
        const daySummary = root.querySelector('.day-summary')
        const statusButtons = Array.from(root.querySelectorAll('[data-status]'))
        const customButton = root.querySelector('[data-status="custom"]')
        const customEditor = root.querySelector('#custom-editor')
        const customInput = root.querySelector('#custom-schedule-input')
        const customErrorElement = root.querySelector('#custom-schedule-error')
        const customSaveButton = root.querySelector('[data-custom-action="save"]')
        const customDeleteButton = root.querySelector('[data-custom-action="delete"]')
        const customCloseButton = root.querySelector('[data-custom-action="close"]')
        const today = new Date()
        const storageKey = `tiny-schedule:selected-member:${roomId}`
        const storedMemberId = localStorage.getItem(storageKey)
        let selectedMemberId = room.members[storedMemberId] ? storedMemberId : null
        let year = today.getFullYear()
        let monthIndex = today.getMonth()
        let selectedDate = dateKey(year, monthIndex, today.getDate())
        let schedules = {}
        let teamHolidays = {}
        let unsubscribeMonth = () => {}
        let unsubscribeHolidays = () => {}
        let saving = false
        let rangeMode = false
        let rangeEndDate = selectedDate
        let rangeDraft = {}
        let rangeError = ''
        let holidaySaving = false
        let holidayPanelOpen = false
        let holidayDraft = ''
        let holidayError = ''
        let customPanelOpen = false
        let customDraft = ''
        let customError = ''
        const subscriptionGuard = createSubscriptionGuard()
        const unsupportedYearNotices = createUnsupportedYearNoticeTracker()
        const teamHolidayRevisions = new Map()

        const resetHolidayEditor = () => {
          holidayPanelOpen = false
          holidayDraft = ''
          holidayError = ''
        }

        const resetCustomEditor = () => {
          customPanelOpen = false
          customDraft = ''
          customError = ''
        }

        const resetRangeEditor = () => {
          rangeMode = false
          rangeEndDate = selectedDate
          rangeDraft = {}
          rangeError = ''
        }

        const setConnectionState = (state) => {
          connectionState.className = `connection-state ${state}`
          connectionState.textContent = state === 'online' ? '온라인' : state === 'local' ? '내 기기' : '오프라인'
        }

        const renderMembers = () => {
          memberPicker.replaceChildren()
          orderedMembers(room.members).forEach(([memberId, member]) => {
            const button = createElement('button', 'member-button')
            button.type = 'button'
            button.setAttribute('aria-pressed', String(selectedMemberId === memberId))
            button.setAttribute('aria-label', `${member.name} 선택`)
            const dot = createElement('span', 'member-dot')
            dot.setAttribute('aria-hidden', 'true')
            button.append(dot, document.createTextNode(member.name))
            button.addEventListener('click', () => {
              selectedMemberId = memberId
              localStorage.setItem(storageKey, memberId)
              resetRangeEditor()
              resetCustomEditor()
              renderMembers()
              renderEditor()
              announce(`${member.name}님을 선택했어요.`)
            })
            memberPicker.append(button)
          })
        }

        const renderGrid = () => {
          monthTitle.textContent = `${year}년 ${monthIndex + 1}월`
          calendarGrid.replaceChildren()
          const monthCells = buildMonthGrid(year, monthIndex, today)
          monthCells.forEach((cell, cellIndex) => {
            if (!cell) {
              const emptyCell = createElement('span', 'day-cell empty')
              emptyCell.setAttribute('role', 'gridcell')
              emptyCell.setAttribute('aria-hidden', 'true')
              calendarGrid.append(emptyCell)
              return
            }
            const button = createElement('button', 'day-cell')
            button.type = 'button'
            button.setAttribute('role', 'gridcell')
            const publicHoliday = getPublicHoliday(cell.key)
            const teamHoliday = normalizeTeamHolidayName(teamHolidays[cell.key])
            const holidayLabel = combineHolidayLabels(publicHoliday, teamHoliday)
            button.setAttribute(
              'aria-label',
              `${monthIndex + 1}월 ${cell.day}일${holidayLabel ? ` ${holidayLabel}` : ''} 일정 보기`,
            )
            if (cell.isSunday) button.classList.add('sunday')
            if (cell.isToday) button.classList.add('today')
            if (cell.key === selectedDate) button.classList.add('selected')
            if (publicHoliday || teamHoliday) button.classList.add('public-holiday')
            const dayHeading = createElement('span', 'day-heading')
            dayHeading.append(createElement('span', 'day-number', String(cell.day)))
            if (publicHoliday) {
              dayHeading.append(createElement('span', 'holiday-label public', publicHoliday))
            }
            if (teamHoliday) {
              dayHeading.append(createElement('span', 'holiday-label public', teamHoliday))
            }
            button.append(dayHeading)
            const summary = summarizeDay(schedules[cell.key], room.members)
            summary.badges.forEach((badge) => {
              const badgeClass = FIXED_STATUSES.find((status) => badge.schedule[status])
                ?? (badge.schedule.custom ? 'custom' : '')
              const badgeElement = createElement(
                'span',
                `schedule-badge ${badgeClass}`,
                `${badge.name} ${badge.label}`,
              )
              const previousCell = cellIndex % 7 === 0 ? null : monthCells[cellIndex - 1]
              const nextCell = cellIndex % 7 === 6 ? null : monthCells[cellIndex + 1]
              if (previousCell && memberSchedulesMatch(
                schedules[previousCell.key]?.[badge.memberId],
                badge.schedule,
              )) {
                badgeElement.classList.add('continues-before')
              }
              if (nextCell && memberSchedulesMatch(
                schedules[nextCell.key]?.[badge.memberId],
                badge.schedule,
              )) {
                badgeElement.classList.add('continues-after')
              }
              button.append(badgeElement)
            })
            if (summary.hiddenCount > 0) button.append(createElement('span', 'more-count', `+${summary.hiddenCount}`))
            button.addEventListener('click', () => {
              selectedDate = cell.key
              resetRangeEditor()
              resetHolidayEditor()
              resetCustomEditor()
              renderGrid()
              renderEditor()
            })
            calendarGrid.append(button)
          })
        }

        const renderEditor = () => {
          const day = Number(selectedDate.slice(-2))
          const hasRangeEndDate = /^\d{4}-\d{2}-\d{2}$/.test(rangeEndDate)
          const rangeEndMonth = hasRangeEndDate ? Number(rangeEndDate.slice(5, 7)) : null
          const rangeEndDay = hasRangeEndDate ? Number(rangeEndDate.slice(-2)) : null
          selectedDateElement.textContent = rangeMode
            ? hasRangeEndDate
              ? `${monthIndex + 1}월 ${day}일~${rangeEndMonth}월 ${rangeEndDay}일`
              : `${monthIndex + 1}월 ${day}일~종료일 선택`
            : `${monthIndex + 1}월 ${day}일`
          editorPerson.textContent = selectedMemberId
            ? `${room.members[selectedMemberId].name}의 일정`
            : '먼저 내 이름을 선택하세요'
          let rangeDates = []
          if (rangeMode && !rangeError) {
            try {
              rangeDates = buildDateRange(selectedDate, rangeEndDate)
            } catch {
              rangeDates = []
            }
          }
          rangeModeButtons.forEach((button) => {
            const isRangeButton = button.dataset.rangeMode === 'range'
            button.setAttribute('aria-pressed', String(isRangeButton === rangeMode))
            button.disabled = saving || (isRangeButton && !selectedMemberId)
          })
          rangeEndField.hidden = !rangeMode
          rangeEndInput.min = selectedDate
          rangeEndInput.max = offsetDateKey(selectedDate, 30)
          rangeEndInput.value = rangeEndDate
          rangeEndInput.disabled = saving
          rangeMessage.hidden = !rangeMode
          rangeMessage.className = `range-message${rangeError ? ' error' : ''}`
          rangeMessage.textContent = rangeError || `${rangeDates.length}일에 같은 일정을 적용합니다.`
          rangeApplyButton.hidden = !rangeMode
          rangeApplyButton.textContent = isEmptyMemberSchedule(rangeDraft)
            ? '기간 일정 삭제'
            : '기간에 적용'
          rangeApplyButton.disabled = !selectedMemberId || saving || Boolean(rangeError) || rangeDates.length === 0
          const publicHoliday = getPublicHoliday(selectedDate)
          const teamHoliday = normalizeTeamHolidayName(teamHolidays[selectedDate])
          holidayDetailList.replaceChildren()
          if (publicHoliday) {
            holidayDetailList.append(
              createElement('span', 'holiday-detail public', `공휴일 · ${publicHoliday}`),
            )
          }
          if (teamHoliday) {
            holidayDetailList.append(
              createElement('span', 'holiday-detail public', `회사 휴일 · ${teamHoliday}`),
            )
          }
          if (!publicHoliday && !teamHoliday) {
            holidayDetailList.append(createElement('span', 'holiday-detail empty', '휴일 없음'))
          }
          holidayEditButton.textContent = teamHoliday ? '휴일 수정' : '휴일 추가'
          holidayEditButton.setAttribute('aria-expanded', String(holidayPanelOpen))
          holidayEditButton.disabled = holidaySaving
          holidayEditor.hidden = !holidayPanelOpen
          teamHolidayInput.value = holidayDraft
          teamHolidayInput.disabled = holidaySaving
          teamHolidayInput.setAttribute('aria-invalid', String(Boolean(holidayError)))
          teamHolidayErrorElement.textContent = holidayError
          holidaySaveButton.disabled = holidaySaving
          holidayDeleteButton.disabled = holidaySaving || !teamHoliday
          holidayCloseButton.disabled = holidaySaving
          daySummary.replaceChildren()
          const selectedSchedules = schedules[selectedDate] ?? {}
          orderedMembers(room.members).forEach(([memberId, member]) => {
            const schedule = normalizeMemberSchedule(selectedSchedules[memberId])
            if (isEmptyMemberSchedule(schedule)) return
            const person = createElement('span', 'day-summary-person')
            person.append(createElement('span', 'day-summary-name', member.name))
            FIXED_STATUSES.forEach((status) => {
              if (schedule[status]) {
                person.append(createElement('span', `day-summary-item ${status}`, statusLabel(status)))
              }
            })
            if (schedule.custom) {
              person.append(createElement('span', 'day-summary-item custom', schedule.custom))
            }
            daySummary.append(person)
          })
          const activeSchedule = selectedMemberId
            ? rangeMode
              ? normalizeMemberSchedule(rangeDraft)
              : normalizeMemberSchedule(selectedSchedules[selectedMemberId])
            : {}
          statusButtons.forEach((button) => {
            button.disabled = !selectedMemberId || saving
            const status = button.dataset.status
            const pressed = status === 'none'
              ? isEmptyMemberSchedule(activeSchedule)
              : status === 'custom'
                ? Boolean(activeSchedule.custom)
                : Boolean(activeSchedule[status])
            button.setAttribute('aria-pressed', String(pressed))
          })
          customButton.setAttribute('aria-expanded', String(customPanelOpen))
          customEditor.hidden = !customPanelOpen
          customInput.value = customDraft
          customInput.disabled = saving
          customInput.setAttribute('aria-invalid', String(Boolean(customError)))
          customErrorElement.textContent = customError
          customSaveButton.disabled = !selectedMemberId || saving
          customDeleteButton.disabled = !selectedMemberId || saving || !activeSchedule.custom
          customCloseButton.disabled = saving
        }

        const persistMemberSchedule = async (nextValue, successMessage) => {
          if (!selectedMemberId || saving) return false
          const memberId = selectedMemberId
          const date = selectedDate
          const month = monthKey(year, monthIndex)
          const previousSchedules = cloneJson(schedules)
          const schedule = serializeMemberSchedule(nextValue)
          schedules[date] ??= {}
          if (schedule === null) delete schedules[date][memberId]
          else schedules[date][memberId] = schedule
          if (Object.keys(schedules[date]).length === 0) delete schedules[date]
          saving = true
          renderGrid()
          renderEditor()
          try {
            await repository.setSchedule(roomId, month, date, memberId, schedule)
            showToast(successMessage)
            return true
          } catch {
            schedules = previousSchedules
            showToast('저장하지 못했어요. 다시 눌러 주세요.')
            return false
          } finally {
            saving = false
            renderGrid()
            renderEditor()
          }
        }

        const persistTeamHoliday = async (nextValue, successMessage) => {
          if (holidaySaving) return false
          const date = selectedDate
          const month = monthKey(year, monthIndex)
          const previousHoliday = normalizeTeamHolidayName(teamHolidays[date])
          const revisionAtStart = teamHolidayRevisions.get(date) ?? 0
          const holidayName = serializeTeamHoliday(nextValue)
          if (holidayName === null) delete teamHolidays[date]
          else teamHolidays[date] = holidayName
          holidaySaving = true
          renderGrid()
          renderEditor()
          try {
            await repository.setHoliday(roomId, month, date, holidayName)
            showToast(successMessage)
            return true
          } catch {
            teamHolidays = rollbackTeamHolidayWrite(
              teamHolidays,
              date,
              previousHoliday,
              revisionAtStart,
              teamHolidayRevisions.get(date) ?? 0,
            )
            showToast('휴일을 저장하지 못했어요. 다시 시도해 주세요.')
            return false
          } finally {
            holidaySaving = false
            renderGrid()
            renderEditor()
          }
        }

        const subscribe = () => {
          const generation = subscriptionGuard.begin()
          unsubscribeMonth()
          unsubscribeHolidays()
          schedules = {}
          teamHolidays = {}
          teamHolidayRevisions.clear()
          renderGrid()
          renderEditor()
          const key = monthKey(year, monthIndex)
          unsubscribeMonth = repository.subscribeMonth(roomId, key, {
            onValue(value) {
              if (!subscriptionGuard.isCurrent(generation)) return
              schedules = value ?? {}
              renderGrid()
              renderEditor()
            },
            onConnection(state) {
              if (subscriptionGuard.isCurrent(generation)) setConnectionState(state)
            },
            onError() {
              if (!subscriptionGuard.isCurrent(generation)) return
              setConnectionState('offline')
              showToast('실시간 연결을 확인해 주세요.')
            },
          })
          unsubscribeHolidays = repository.subscribeHolidays(roomId, key, {
            onValue(value) {
              if (!subscriptionGuard.isCurrent(generation)) return
              const nextTeamHolidays = Object.fromEntries(
                Object.entries(value ?? {})
                  .map(([date, name]) => [date, normalizeTeamHolidayName(name)])
                  .filter(([, name]) => Boolean(name)),
              )
              const changedDates = new Set([
                ...Object.keys(teamHolidays),
                ...Object.keys(nextTeamHolidays),
              ])
              changedDates.forEach((date) => {
                if (teamHolidays[date] !== nextTeamHolidays[date]) {
                  teamHolidayRevisions.set(date, (teamHolidayRevisions.get(date) ?? 0) + 1)
                }
              })
              teamHolidays = nextTeamHolidays
              renderGrid()
              renderEditor()
            },
            onConnection(state) {
              if (subscriptionGuard.isCurrent(generation)) setConnectionState(state)
            },
            onError() {
              if (!subscriptionGuard.isCurrent(generation)) return
              showToast('회사 휴일 실시간 연결을 확인해 주세요.')
            },
          })
        }

        const changeMonth = (offset) => {
          const next = moveMonth(year, monthIndex, offset)
          year = next.year
          monthIndex = next.monthIndex
          const isCurrentMonth = year === today.getFullYear() && monthIndex === today.getMonth()
          selectedDate = dateKey(year, monthIndex, isCurrentMonth ? today.getDate() : 1)
          resetRangeEditor()
          resetHolidayEditor()
          resetCustomEditor()
          subscribe()
          if (unsupportedYearNotices.shouldNotify(year)) {
            showToast('이 연도의 공휴일 데이터는 준비되지 않았어요.')
          }
        }

        holidayEditButton.addEventListener('click', () => {
          if (holidaySaving) return
          if (holidayPanelOpen) {
            resetHolidayEditor()
            renderEditor()
            holidayEditButton.focus()
            return
          }
          holidayPanelOpen = true
          holidayDraft = normalizeTeamHolidayName(teamHolidays[selectedDate]) ?? ''
          holidayError = ''
          renderEditor()
          requestAnimationFrame(() => teamHolidayInput.focus())
        })

        teamHolidayInput.addEventListener('input', () => {
          holidayDraft = teamHolidayInput.value
          holidayError = ''
          teamHolidayInput.removeAttribute('aria-invalid')
          teamHolidayErrorElement.textContent = ''
        })

        holidaySaveButton.addEventListener('click', async () => {
          if (holidaySaving) return
          const holidayName = normalizeTeamHolidayName(holidayDraft)
          if (!holidayName) {
            holidayError = holidayDraft.trim().length > 20
              ? '휴일명은 20자 이내로 입력해 주세요.'
              : '휴일명을 입력해 주세요.'
            renderEditor()
            teamHolidayInput.focus()
            return
          }
          if (await persistTeamHoliday(holidayName, '회사 휴일을 저장했어요.')) {
            resetHolidayEditor()
            renderEditor()
            holidayEditButton.focus()
          }
        })

        holidayDeleteButton.addEventListener('click', async () => {
          if (holidaySaving || !teamHolidays[selectedDate]) return
          if (await persistTeamHoliday(null, '회사 휴일을 삭제했어요.')) {
            resetHolidayEditor()
            renderEditor()
            holidayEditButton.focus()
          }
        })

        holidayCloseButton.addEventListener('click', () => {
          if (holidaySaving) return
          resetHolidayEditor()
          renderEditor()
          holidayEditButton.focus()
        })

        rangeModeButtons.forEach((button) => {
          button.addEventListener('click', () => {
            if (saving) return
            if (button.dataset.rangeMode === 'single') {
              resetRangeEditor()
              resetCustomEditor()
              renderEditor()
              return
            }
            if (!selectedMemberId) return
            if (rangeMode) return
            rangeMode = true
            rangeEndDate = offsetDateKey(selectedDate, 1)
            rangeDraft = normalizeMemberSchedule(schedules[selectedDate]?.[selectedMemberId])
            rangeError = ''
            resetCustomEditor()
            renderEditor()
            rangeEndInput.focus()
          })
        })

        rangeEndInput.addEventListener('change', () => {
          rangeEndDate = rangeEndInput.value
          try {
            buildDateRange(selectedDate, rangeEndDate)
            rangeError = ''
          } catch (error) {
            rangeError = error instanceof Error ? error.message : '날짜 범위를 확인해 주세요.'
          }
          renderEditor()
        })

        rangeApplyButton.addEventListener('click', async () => {
          if (!rangeMode || !selectedMemberId || saving) return
          let dates
          try {
            dates = buildDateRange(selectedDate, rangeEndDate)
          } catch (error) {
            rangeError = error instanceof Error ? error.message : '날짜 범위를 확인해 주세요.'
            renderEditor()
            return
          }
          const memberId = selectedMemberId
          const schedule = serializeMemberSchedule(rangeDraft)
          saving = true
          rangeError = ''
          renderEditor()
          try {
            await repository.setScheduleRange(roomId, dates, memberId, schedule)
            const visibleMonth = monthKey(year, monthIndex)
            dates.filter((date) => date.startsWith(`${visibleMonth}-`)).forEach((date) => {
              schedules[date] ??= {}
              if (schedule === null) delete schedules[date][memberId]
              else schedules[date][memberId] = schedule
              if (Object.keys(schedules[date]).length === 0) delete schedules[date]
            })
            showToast(`${dates.length}일 일정을 저장했어요.`)
            resetRangeEditor()
          } catch {
            rangeError = '기간 일정을 저장하지 못했어요. 다시 시도해 주세요.'
            showToast(rangeError)
          } finally {
            saving = false
            renderGrid()
            renderEditor()
          }
        })

        statusButtons.forEach((button) => {
          button.addEventListener('click', async () => {
            if (!selectedMemberId || saving) return
            const status = button.dataset.status
            if (status === 'custom') {
              if (customPanelOpen) {
                resetCustomEditor()
                renderEditor()
                customButton.focus()
              } else {
                const current = rangeMode
                  ? normalizeMemberSchedule(rangeDraft)
                  : normalizeMemberSchedule(schedules[selectedDate]?.[selectedMemberId])
                customPanelOpen = true
                customDraft = current.custom ?? ''
                customError = ''
                renderEditor()
                requestAnimationFrame(() => customInput.focus())
              }
              return
            }
            const current = rangeMode
              ? normalizeMemberSchedule(rangeDraft)
              : normalizeMemberSchedule(schedules[selectedDate]?.[selectedMemberId])
            const nextValue = status === 'none' ? {} : toggleFixedStatus(current, status)
            if (rangeMode) {
              rangeDraft = nextValue
              rangeError = ''
              renderEditor()
              return
            }
            const message = status === 'none'
              ? '일정을 모두 지웠어요.'
              : `${statusLabel(status)} 일정을 변경했어요.`
            await persistMemberSchedule(nextValue, message)
          })
        })

        customInput.addEventListener('input', () => {
          customDraft = customInput.value
          customError = ''
          customInput.removeAttribute('aria-invalid')
          customErrorElement.textContent = ''
        })

        customSaveButton.addEventListener('click', async () => {
          if (!selectedMemberId || saving) return
          const current = rangeMode
            ? normalizeMemberSchedule(rangeDraft)
            : normalizeMemberSchedule(schedules[selectedDate]?.[selectedMemberId])
          let nextValue
          try {
            nextValue = setCustomSchedule(current, customDraft)
          } catch (error) {
            customError = error instanceof Error ? error.message : '기타 일정을 입력해 주세요.'
            renderEditor()
            customInput.focus()
            return
          }
          if (rangeMode) {
            rangeDraft = nextValue
            rangeError = ''
            resetCustomEditor()
            renderEditor()
            customButton.focus()
            return
          }
          if (await persistMemberSchedule(nextValue, '기타 일정을 저장했어요.')) {
            resetCustomEditor()
            renderEditor()
            customButton.focus()
          }
        })

        customDeleteButton.addEventListener('click', async () => {
          if (!selectedMemberId || saving) return
          const current = rangeMode
            ? normalizeMemberSchedule(rangeDraft)
            : normalizeMemberSchedule(schedules[selectedDate]?.[selectedMemberId])
          if (rangeMode) {
            rangeDraft = clearCustomSchedule(current)
            rangeError = ''
            resetCustomEditor()
            renderEditor()
            customButton.focus()
            return
          }
          if (await persistMemberSchedule(clearCustomSchedule(current), '기타 일정을 삭제했어요.')) {
            resetCustomEditor()
            renderEditor()
            customButton.focus()
          }
        })

        customCloseButton.addEventListener('click', () => {
          if (saving) return
          resetCustomEditor()
          renderEditor()
          customButton.focus()
        })

        root.querySelector('#previous-month').addEventListener('click', () => changeMonth(-1))
        root.querySelector('#next-month').addEventListener('click', () => changeMonth(1))
        root.querySelector('#new-room').addEventListener('click', () => {
          subscriptionGuard.begin()
          unsubscribeMonth()
          unsubscribeHolidays()
          returnToCreation({
            currentUrl: location.href,
            replaceUrl: (url) => history.replaceState(null, '', url),
            openCreate: () => openCreateScreen(root),
          })
        })
        root.querySelector('#share-room').addEventListener('click', async () => {
          const url = buildShareUrl(location.href, roomId, repository.databaseUrl)
          if (repository.mode === 'local') {
            showManualShareDialog(url, true)
            return
          }
          const result = await shareUrl(`${room.meta.title} 일정`, url)
          if (result === 'copied') showToast('공유 링크를 복사했어요.')
          if (result === 'manual') showManualShareDialog(url, false)
        })

        renderMembers()
        renderGrid()
        renderEditor()
        subscribe()
        return () => {
          unsubscribeMonth()
          unsubscribeHolidays()
        }
      }

      async function boot() {
        const root = document.querySelector('#app')
        const search = new URLSearchParams(location.search)
        const rawDatabaseUrl = search.get('db')
        const databaseUrl = resolveDatabaseUrl({
          queryValue: rawDatabaseUrl,
          metaValue: document.querySelector('meta[name="default-database-url"]')?.content,
          rememberedValue: localStorage.getItem('tiny-schedule:database-url'),
        })
        const roomId = parseRoomId(location.hash)

        if (hasInvalidExplicitDatabaseUrl(rawDatabaseUrl)) {
          renderStatePage(root, {
            title: '연결 주소가 올바르지 않아요',
            message: '공유 링크의 Firebase Database URL을 확인해 주세요.',
          })
          return
        }

        if (!roomId) {
          renderCreateView(root, databaseUrl ?? '')
          return
        }

        const repository = databaseUrl ? createFirebaseRepository(databaseUrl) : createLocalRepository()
        renderStatePage(root, {
          symbol: '…',
          title: '일정판을 불러오는 중',
          message: '잠시만 기다려 주세요.',
          createNew: false,
        })
        try {
          const room = await repository.getRoom(roomId)
          if (!room) {
            renderStatePage(root, {
              title: '일정판을 찾을 수 없어요',
              message: repository.mode === 'local'
                ? '이 기기에 저장되지 않았거나 삭제된 일정판이에요.'
                : '링크가 잘렸거나 일정판이 삭제되었어요.',
            })
            return
          }
          renderCalendarView(root, { roomId, room, repository })
        } catch {
          renderStatePage(root, {
            title: '일정판을 불러오지 못했어요',
            message: '인터넷 연결과 Firebase Database 규칙을 확인해 주세요.',
            retry: () => location.reload(),
          })
        }
      }

      if (typeof document !== 'undefined' && typeof location !== 'undefined') {
        boot()
      }
    </script>
  </body>
</html>
